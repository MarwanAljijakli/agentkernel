name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-tests:
    name: Full tests and coverage (${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux
            os: ubuntu-latest
            timeout_minutes: 45
          - lane: windows
            os: windows-latest
            timeout_minutes: 120
    env:
      AGENTKERNEL_COVERAGE_LANE: ${{ matrix.lane }}
      AGENTKERNEL_COVERAGE_COMMIT_SHA: ${{ github.sha }}
      AGENTKERNEL_COVERAGE_WORKFLOW_RUN_ID: ${{ github.run_id }}
      AGENTKERNEL_COVERAGE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trace evidence is verified against frozen historical commits.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Run the complete Linux check
        if: matrix.lane == 'linux'
        shell: bash
        run: bash scripts/check.sh
      - name: Run the complete Windows check
        if: matrix.lane == 'windows'
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Verify generated schemas are current
        if: matrix.lane == 'linux'
        run: |
          uv run agentkernel schema export --output schemas/v1alpha1
          git diff --exit-code -- schemas/v1alpha1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: coverage-evidence-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: test-results/coverage-evidence/${{ matrix.lane }}/run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-report-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: test-results/junit-${{ matrix.lane }}.xml
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: distributions-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error

  coverage-union:
    name: Cross-platform coverage union (85%)
    needs: platform-tests
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require both full-test lanes
        env:
          PLATFORM_TEST_RESULT: ${{ needs.platform-tests.result }}
        run: test "$PLATFORM_TEST_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install locked coverage tooling
        run: uv sync --frozen
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-evidence-linux-attempt-${{ github.run_attempt }}
          path: downloaded-coverage/coverage-evidence/linux/run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-evidence-windows-attempt-${{ github.run_attempt }}
          path: downloaded-coverage/coverage-evidence/windows/run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      - name: Verify exact-run databases and enforce the union gate
        env:
          COVERAGE_COMMIT_SHA: ${{ github.sha }}
          COVERAGE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          COVERAGE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          uv run python scripts/coverage_evidence.py union \
            --repo-root . \
            --evidence-root downloaded-coverage/coverage-evidence \
            --output-dir "test-results/coverage-union/run-$COVERAGE_WORKFLOW_RUN_ID-attempt-$COVERAGE_WORKFLOW_RUN_ATTEMPT" \
            --lane linux \
            --lane windows \
            --commit-sha "$COVERAGE_COMMIT_SHA" \
            --workflow-run-id "$COVERAGE_WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$COVERAGE_WORKFLOW_RUN_ATTEMPT" \
            --fail-under 85
          cat "test-results/coverage-union/run-$COVERAGE_WORKFLOW_RUN_ID-attempt-$COVERAGE_WORKFLOW_RUN_ATTEMPT/coverage-union.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-union-attempt-${{ github.run_attempt }}
          path: |
            test-results/coverage-union/run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
            downloaded-coverage/coverage-evidence/*/run-${{ github.run_id }}-attempt-${{ github.run_attempt }}/coverage-evidence.json
          include-hidden-files: true
          if-no-files-found: warn

  locked-install:
    name: Clean locked install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run agentkernel doctor --json
      - run: uv run python -c "import agentkernel; print(agentkernel.__version__)"

  docker-controls:
    name: Docker container-control evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen
      - name: Pull the pinned multi-architecture image
        run: >-
          docker pull
          python@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
      - name: Inspect effective controls
        run: uv run agentkernel sandbox verify-docker --json
      - name: Exercise rootfs, network, and host-mount boundaries
        run: uv run pytest tests/integration/test_docker_sandbox.py -q
